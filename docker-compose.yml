services:
  postgres:
    image: postgres:16-alpine
    environment:
      # POSTGRES_USER is deliberately left unset so the image's own bootstrap
      # superuser defaults to "postgres" -- an internal-only identity the app
      # never connects as. APP_DB_USER/PASSWORD (read by the init script) reuse
      # the same values the backend itself connects with.
      POSTGRES_DB: ${POSTGRES_DB:-db_playground}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_USER: ${POSTGRES_USER:-db_playground}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  mongodb:
    image: mongo:7
    environment:
      # MONGO_INITDB_ROOT_* is the image's own bootstrap admin, used only by
      # the init script below to create the app's real (non-root) user.
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ADMIN_PASSWORD:?Set MONGODB_ADMIN_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-db_playground}
      MONGO_APP_DB: ${MONGODB_DATABASE:-db_playground}
      MONGO_APP_USER: ${MONGODB_USERNAME:-db_playground}
      MONGO_APP_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongodb_data:/data/db
      - ./backend/docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # CMD-SHELL (not exec-form CMD) so the container's own shell -- which has
      # MONGO_INITDB_ROOT_PASSWORD in its environment -- expands $$ into it;
      # exec-form CMD passes arguments literally with no shell involved at all.
      test: ["CMD-SHELL", "mongosh --quiet -u admin -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: [.env]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mongodb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  mongodb_data:
