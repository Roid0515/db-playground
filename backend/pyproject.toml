[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "db-playground-backend"
version = "1.1.0"
description = "Phase 3 API for DB Playground"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "psycopg[binary]>=3.2,<4", "pymongo>=4.10,<5", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "faker>=30,<31"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
desktop = ["pyinstaller>=6.10,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]